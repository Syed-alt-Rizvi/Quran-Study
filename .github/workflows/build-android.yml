name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Build Web App
        run: npm run build
        
      - name: Verify Images
        run: |
          for f in assets/icon.png assets/splash.png; do
            if ! head -c 8 "$f" | xxd -p | grep -qi '^89504e470d0a1a0a'; then
              echo "ERROR: $f does not have valid PNG signature" >&2
              exit 2
            fi
            identify -format "%m %z-bit %r %w x %h\n" "$f" || { echo "identify failed for $f"; exit 3; }
          done

      - name: Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Generate Assets
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --iconBackgroundColor '#eeeeee' --iconBackgroundColorDark '#222222' --splashBackgroundColor '#eeeeee' --splashBackgroundColorDark '#222222'
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'
          cache-disabled: true
        
      - name: Build APK
        working-directory: ./android
        run: gradle assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Study-App.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
