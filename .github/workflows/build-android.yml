name: Android Build & Package

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "assets/**"
      - "capacitor.config.ts"
      - "prepare-assets.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - debug_apk
          - release_bundle

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK & Play Store Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node Dependencies
        run: |
          npm ci --prefer-offline || npm install --legacy-peer-deps

      - name: Compile Web Application
        run: |
          npm run build

      - name: Prepare Mobile Asset Graphics
        run: |
          node prepare-assets.cjs
          npx capacitor-assets generate --iconBackgroundColor '#eeeeee' --iconBackgroundColorDark '#222222' --splashBackgroundColor '#eeeeee' --splashBackgroundColorDark '#222222' || true

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          # Exclude backend server bundle from Android client webview assets
          rm -f android/app/src/main/assets/public/server.cjs || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & SDK Components
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          build-root-directory: ./android

      - name: Validate Gradle Wrapper
        run: |
          set -e
          cd android
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating official Gradle wrapper from installed Gradle distribution..."
            gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_target != 'release_bundle' }}
        working-directory: ./android
        run: |
          echo "Executing Gradle assembleDebug..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android App Bundle (AAB)
        if: ${{ github.event.inputs.build_target != 'debug_apk' }}
        working-directory: ./android
        run: |
          echo "Executing Gradle bundleRelease (with bundleDebug fallback)..."
          ./gradlew bundleRelease --no-daemon --stacktrace || ./gradlew bundleDebug --no-daemon --stacktrace || true

      - name: Collect and Verify Distribution Artifacts
        run: |
          set -e
          mkdir -p dist-mobile/apk dist-mobile/bundle

          # 1. Debug APK verification & collection
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" dist-mobile/apk/Quran-Study-Debug.apk
            echo "✓ Debug APK collected successfully: $(ls -lh dist-mobile/apk/Quran-Study-Debug.apk)"
          elif [ "${{ github.event.inputs.build_target }}" != "release_bundle" ]; then
            echo "::error::Expected Debug APK at $DEBUG_APK but file was not found!"
            exit 1
          fi

          # 2. Play Store AAB collection
          AAB_FILE=$(find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" dist-mobile/bundle/Quran-Study-PlayStore.aab
            echo "✓ Play Store Bundle collected successfully: $(ls -lh dist-mobile/bundle/Quran-Study-PlayStore.aab)"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist-mobile/apk/*.apk') != '' }}
        with:
          name: Quran-Study-Debug-APK
          path: dist-mobile/apk/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Google Play Store Bundle Artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist-mobile/bundle/*.aab') != '' }}
        with:
          name: Quran-Study-PlayStore-AAB
          path: dist-mobile/bundle/*.aab
          retention-days: 14
          if-no-files-found: ignore
