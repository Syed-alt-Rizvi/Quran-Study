name: Build Mobile Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --loglevel verbose
        
      - name: Build Web App
        run: npm run build

      - name: Workaround AI Studio Binary Sync Bug
        run: |
          set -ex
          npm install sharp
          cat << 'SCRIPT' > convert.cjs
          const sharp = require('sharp');
          async function run() {
            await sharp('assets/icon.svg').resize(1024, 1024).png().toFile('assets/icon.png');
            await sharp('assets/splash.svg').resize(2732, 2732).png().toFile('assets/splash.png');
            console.log('Images generated successfully.');
          }
          run().catch(err => {
            console.error('Image generation error:', err);
            process.exit(1);
          });
          SCRIPT
          node convert.cjs
        
      - name: Verify Images
        run: |
          set -ex
          for f in assets/icon.png assets/splash.png; do
            signature=$(od -A n -N 8 -t x1 "$f" | tr -d ' \n')
            if [ "$signature" != "89504e470d0a1a0a" ]; then
              echo "::error file=$f,line=1,col=1::ERROR: $f does not have valid PNG signature (found: $signature)"
              exit 2
            fi
            file "$f" | grep -qi "PNG" || { 
              echo "::error file=$f,line=1,col=1::file failed to recognize PNG for $f"; 
              file "$f"; 
              exit 3; 
            }
          done

      - name: Sync Capacitor
        run: |
          set -ex
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Generate Assets
        run: |
          set -ex
          npm install -D @capacitor/assets --loglevel verbose
          npx capacitor-assets generate --iconBackgroundColor '#eeeeee' --iconBackgroundColorDark '#222222' --splashBackgroundColor '#eeeeee' --splashBackgroundColorDark '#222222'
          npx cap copy android
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'
          build-root-directory: ./android
          cache-disabled: true
        
      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Android App Bundle (Google Play AAB) & APKs
        working-directory: ./android
        run: |
          set -x
          # 1. Build APKs for direct device installation & testing
          ./gradlew assembleDebug --no-daemon --stacktrace || true

          # 2. Build Android App Bundle (.aab) required for Google Play Console upload
          ./gradlew bundleRelease --no-daemon --stacktrace || ./gradlew bundleDebug --no-daemon --stacktrace || true
          
          # 3. Release APK (if applicable)
          ./gradlew assembleRelease --no-daemon --stacktrace || true

          echo "Listing all generated APKs and AABs:"
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) || true
        
      - name: Prepare Android Artifacts
        if: always()
        run: |
          set -x
          mkdir -p build-artifacts/play-store-bundle
          mkdir -p build-artifacts/apk

          # Collect and label AAB files for Google Play Store
          find android -type f -name "*.aab" -exec cp {} build-artifacts/play-store-bundle/ \; 2>/dev/null || true
          if [ -f "build-artifacts/play-store-bundle/app-release.aab" ]; then
            cp "build-artifacts/play-store-bundle/app-release.aab" "build-artifacts/play-store-bundle/Quran-Study-PlayStore-Release.aab"
          fi
          if [ -f "build-artifacts/play-store-bundle/app-debug.aab" ]; then
            cp "build-artifacts/play-store-bundle/app-debug.aab" "build-artifacts/play-store-bundle/Quran-Study-PlayStore-Debug.aab"
          fi

          # Collect and label APK files
          find android -type f -name "*.apk" -exec cp {} build-artifacts/apk/ \; 2>/dev/null || true
          if [ -f "build-artifacts/apk/app-debug.apk" ]; then
            cp "build-artifacts/apk/app-debug.apk" "build-artifacts/apk/Quran Study.apk"
          fi
          if [ -f "build-artifacts/apk/app-release.apk" ]; then
            cp "build-artifacts/apk/app-release.apk" "build-artifacts/apk/Quran-Study-Release.apk"
          fi

          # Maintain legacy output path for backward compatibility
          mkdir -p android/app/build/outputs/apk/debug
          if [ -f "build-artifacts/apk/Quran Study.apk" ]; then
            cp "build-artifacts/apk/Quran Study.apk" "android/app/build/outputs/apk/debug/Quran Study.apk"
          fi

          echo "Contents of build-artifacts/play-store-bundle:"
          ls -la build-artifacts/play-store-bundle || true
          echo "Contents of build-artifacts/apk:"
          ls -la build-artifacts/apk || true
        
      - name: Upload Google Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Quran-Study-PlayStore-AAB
          path: |
            build-artifacts/play-store-bundle/*.aab
            android/**/*.aab
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Quran-Study-APK
          path: |
            build-artifacts/apk/*.apk
            android/app/build/outputs/apk/debug/Quran Study.apk
            android/**/*.apk
          if-no-files-found: warn

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --loglevel verbose
        
      - name: Build Web App
        run: npm run build

      - name: Workaround AI Studio Binary Sync Bug
        run: |
          set -ex
          npm install sharp
          cat << 'SCRIPT' > convert.cjs
          const sharp = require('sharp');
          async function run() {
            await sharp('assets/icon.svg').resize(1024, 1024).png().toFile('assets/icon.png');
            await sharp('assets/splash.svg').resize(2732, 2732).png().toFile('assets/splash.png');
            console.log('Images generated successfully.');
          }
          run().catch(err => {
            console.error('Image generation error:', err);
            process.exit(1);
          });
          SCRIPT
          node convert.cjs
        
      - name: Verify Images
        run: |
          set -ex
          for f in assets/icon.png assets/splash.png; do
            signature=$(od -A n -N 8 -t x1 "$f" | tr -d ' \n')
            if [ "$signature" != "89504e470d0a1a0a" ]; then
              echo "::error file=$f,line=1,col=1::ERROR: $f does not have valid PNG signature (found: $signature)"
              exit 2
            fi
            file "$f" | grep -qi "PNG" || { 
              echo "::error file=$f,line=1,col=1::file failed to recognize PNG for $f"; 
              file "$f"; 
              exit 3; 
            }
          done

      - name: Sync Capacitor
        run: |
          set -ex
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi

      - name: Generate Assets
        run: |
          set -ex
          npm install -D @capacitor/assets --loglevel verbose
          npx capacitor-assets generate --iconBackgroundColor '#eeeeee' --iconBackgroundColorDark '#222222' --splashBackgroundColor '#eeeeee' --splashBackgroundColorDark '#222222'
          npx cap copy ios
        
      - name: Resolve SPM Dependencies
        working-directory: ./ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No iOS signing certificate secret found. Skipping certificate installation."
            exit 0
          fi

          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build iOS App
        working-directory: ./ios/App
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ]; then
            # Build the app with code signing enabled automatically using the imported profile
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_STYLE=Manual
          else
            # Unsigned build fallback if no certificate secret is configured
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi
          
          # Create IPA
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/ 2>/dev/null || cp -r build/Build/Products/*-iphoneos/*.app Payload/ 2>/dev/null || true
          if [ -d "Payload/App.app" ]; then
            zip -r "Quran Study.ipa" Payload
          fi
        
      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Quran-Study-iOS-IPA
          path: ios/App/*.ipa
          if-no-files-found: warn
