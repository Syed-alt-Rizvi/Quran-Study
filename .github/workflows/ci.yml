name: Build & Release Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - direct_install_apk
          - playstore_bundle

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Web & Android Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline || npm install --legacy-peer-deps

      - name: Code Quality & Typecheck
        run: |
          if npm run | grep -qE "^\s*lint\b"; then
            npm run lint
          elif npm run | grep -qE "^\s*typecheck\b"; then
            npm run typecheck
          else
            npx tsc --noEmit
          fi

      - name: Compile Web Application
        run: |
          npm run build
          if [ ! -f "dist/server.cjs" ]; then
            npx esbuild server.ts --bundle --platform=node --format=cjs --outfile=dist/server.cjs --external:vite --external:express --external:cors || true
          fi

      - name: Verify Web Distribution Assets
        run: |
          set -e
          test -s dist/index.html || { echo "::error::dist/index.html is missing or empty!"; exit 1; }
          if [ -s "dist/server.cjs" ]; then
            node -c dist/server.cjs
          fi
          echo "✓ Web bundle verified successfully."

      - name: Sync Capacitor Android
        run: |
          node prepare-assets.cjs || true
          npx cap sync android || npx @capacitor/cli sync android
          rm -f android/app/src/main/assets/public/server.cjs || true
          mkdir -p android/app/src/main/res/raw
          if [ -f "public/audio/shia_adhan.mp3" ]; then
            cp -f public/audio/shia_adhan.mp3 android/app/src/main/res/raw/shia_adhan.mp3
          fi
          mkdir -p android/app/src/main/assets/public/mafatih_items
          if [ -d "public/mafatih_items" ]; then
            cp -rf public/mafatih_items/* android/app/src/main/assets/public/mafatih_items/
          fi
          echo "✓ Android web assets and raw adhan audio synchronized successfully."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept Android SDK Licenses & Configure Environment
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\nd97546487611a3004928236c860b201a607357a7" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "✓ Android SDK environment verified."

      - name: Validate Gradle Wrapper & Permissions
        run: |
          sed -i 's/\r$//' android/gradlew || true
          chmod +x android/gradlew
          test -s "android/gradle/wrapper/gradle-wrapper.jar" || { echo "::error::gradle-wrapper.jar could not be verified!"; exit 1; }
          echo "✓ Gradle wrapper verified successfully ($(ls -lh android/gradle/wrapper/gradle-wrapper.jar))"

      - name: Ensure Android Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Generating standardized debug keystore..."
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f "$HOME/.android/debug.keystore" android/app/debug.keystore
          echo "✓ Android debug keystore prepared successfully."

      - name: Configure Custom Keystore if Secret Configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding custom signing keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_NAME" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "✓ Custom release keystore loaded."
          else
            echo "No custom release keystore secret configured. Gradle will sign with standard debug key for immediate installation."
          fi

      - name: Build Direct Installation APK (assembleDebug)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target != 'playstore_bundle' }}
        working-directory: ./android
        run: |
          echo "Building debug APK for direct phone installation..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Google Play Store Bundle (bundleRelease)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target != 'direct_install_apk' }}
        working-directory: ./android
        run: |
          echo "Building release bundle for Google Play Store..."
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Collect and Verify Distribution Artifacts
        run: |
          set -e
          mkdir -p dist-mobile/apk dist-mobile/bundle

          WANT_APK="${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target != 'playstore_bundle' }}"
          WANT_AAB="${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target != 'direct_install_apk' }}"

          # 1. Direct Install APK verification & collection
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*androidTest*" 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" dist-mobile/apk/Shia-Markaz-DirectInstall.apk
            echo "✓ Direct-install APK ready: $(ls -lh dist-mobile/apk/Shia-Markaz-DirectInstall.apk)"
          elif [ "$WANT_APK" = "true" ]; then
            echo "::error::Expected Debug APK but none was found under android/app/build/outputs/apk!"
            exit 1
          else
            echo "Skipping APK collection as requested by workflow input."
          fi

          # 2. Google Play Store AAB collection
          AAB_FILE=$(find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" dist-mobile/bundle/Shia-Markaz-PlayStore.aab
            echo "✓ Play Store Bundle ready: $(ls -lh dist-mobile/bundle/Shia-Markaz-PlayStore.aab)"
          elif [ "$WANT_AAB" = "true" ]; then
            echo "::error::Expected Play Store AAB file but none was found under android/app/build/outputs/bundle!"
            exit 1
          else
            echo "Skipping AAB collection as requested by workflow input."
          fi

          # 3. Include comprehensive distribution documentation
          cp android/DISTRIBUTION_README.txt dist-mobile/README.txt

      - name: Upload Direct Install APK Artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist-mobile/apk/*.apk') != '' }}
        with:
          name: Shia-Markaz-DirectInstall-APK
          path: dist-mobile/apk/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Google Play Store Bundle Artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist-mobile/bundle/*.aab') != '' }}
        with:
          name: Shia-Markaz-PlayStore-AAB
          path: dist-mobile/bundle/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Complete Android Release Package
        uses: actions/upload-artifact@v4
        with:
          name: Shia-Markaz-Android-Full-Package
          path: dist-mobile/**
          retention-days: 30
          if-no-files-found: warn
