name: iOS Build & Package (Manual)

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: "Xcode Build Configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node Dependencies
        run: |
          npm ci --prefer-offline || npm install --legacy-peer-deps

      - name: Compile Web Application
        run: |
          npm run build

      - name: Prepare Mobile Asset Graphics
        run: |
          node prepare-assets.cjs
          npx capacitor-assets generate --iconBackgroundColor '#eeeeee' --iconBackgroundColorDark '#222222' --splashBackgroundColor '#eeeeee' --splashBackgroundColorDark '#222222' || true

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios
          # Exclude backend server bundle from iOS client webview assets
          rm -f ios/App/App/public/server.cjs || true

      - name: Resolve Swift Package Manager Dependencies
        working-directory: ./ios/App
        run: |
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Install Apple Developer Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::warning::No IOS_CERTIFICATE_BASE64 secret provided. Code signing will be disabled for simulator/un-signed build."
            exit 0
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-key-param-list -lut 21600 $KEYCHAIN_PATH || security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build iOS Application Archive
        working-directory: ./ios/App
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          set -e
          CONFIG="${{ github.event.inputs.build_configuration }}"

          if [ -n "$IOS_CERTIFICATE_BASE64" ]; then
            echo "Building with Apple Developer code signing..."
            xcodebuild -project App.xcodeproj -scheme App -configuration "$CONFIG" -sdk iphoneos -derivedDataPath build CODE_SIGNING_STYLE=Manual
          else
            echo "Building without code signing (Simulator / Archive test)..."
            xcodebuild -project App.xcodeproj -scheme App -configuration "$CONFIG" -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

          mkdir -p Payload
          cp -r build/Build/Products/*-iphoneos/*.app Payload/ 2>/dev/null || true
          if [ -d "Payload/App.app" ]; then
            zip -r "Quran-Study.ipa" Payload
            mkdir -p ../../dist-mobile/ios
            mv "Quran-Study.ipa" ../../dist-mobile/ios/
            echo "✓ IPA successfully generated: $(ls -lh ../../dist-mobile/ios/Quran-Study.ipa)"
          else
            echo "::warning::Payload/App.app directory was not created. Skipping IPA packaging."
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist-mobile/ios/*.ipa') != '' }}
        with:
          name: Quran-Study-iOS-IPA
          path: dist-mobile/ios/*.ipa
          retention-days: 14
          if-no-files-found: ignore
