// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:${rootProject.ext.androidxCoreVersion}"
            force "androidx.activity:activity:${rootProject.ext.androidxActivityVersion}"
            force "androidx.fragment:fragment:${rootProject.ext.androidxFragmentVersion}"
            force "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
            force "androidx.coordinatorlayout:coordinatorlayout:${rootProject.ext.androidxCoordinatorLayoutVersion}"
            force "androidx.webkit:webkit:${rootProject.ext.androidxWebkitVersion}"
        }
    }



    // Ensure lint never breaks APK/AAB compilation across submodules
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach {
        enabled = false
    }
}

subprojects {
    afterEvaluate { subproject ->
        if (subproject.hasProperty('android')) {
            subproject.android {
                if (rootProject.ext.has('compileSdkVersion')) {
                    compileSdk = rootProject.ext.compileSdkVersion
                }
                if (rootProject.ext.has('targetSdkVersion') && defaultConfig.targetSdk != null) {
                    defaultConfig.targetSdkVersion = rootProject.ext.targetSdkVersion
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
