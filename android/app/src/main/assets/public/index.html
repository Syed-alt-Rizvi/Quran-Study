    <!-- DYNAMIC BROADCAST BANNER SYSTEM (WebView / Hybrid Shell Implementation)   -->

    <style id="broadcast-banner-styles">
      :root {
        /* Mobile Safe Area Inset Support (Notches, Status Bar on iOS & Android) */
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
      }

      /* 
       * Smooth Content Push-Down (Eliminates aggressive layout snapping)
       * CSS Grid template-rows transition animates from 0fr to 1fr smoothly.
       */
      .broadcast-wrapper {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 350ms cubic-bezier(0.16, 1, 0.3, 1);
        width: 100%;
        position: relative;
        z-index: 99999;
        overflow: hidden;
      }

      .broadcast-wrapper.is-visible {
        grid-template-rows: 1fr;
      }

      .broadcast-banner {
        min-height: 0;
        transform: translateY(-100%);
        transition: transform 350ms cubic-bezier(0.16, 1, 0.3, 1), opacity 250ms ease;
        opacity: 0;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .broadcast-wrapper.is-visible .broadcast-banner {
        transform: translateY(0);
        opacity: 1;
      }

      .broadcast-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: max(10px, var(--safe-area-top));
        padding-bottom: 10px;
        padding-left: max(16px, var(--safe-area-left));
        padding-right: max(16px, var(--safe-area-right));
        max-width: 1200px;
        margin: 0 auto;
        box-sizing: border-box;
      }

      .broadcast-content {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        flex: 1;
        min-width: 0;
      }

      .broadcast-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .broadcast-text {
        margin: 0;
        font-size: 13px;
        line-height: 1.4;
        font-weight: 500;
        word-break: break-word;
        flex: 1;
        min-width: 140px;
      }

      .broadcast-action {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
        color: inherit;
        opacity: 0.95;
        white-space: nowrap;
        transition: opacity 150ms ease;
      }

      .broadcast-action:hover, .broadcast-action:focus-visible {
        opacity: 1;
      }

      .broadcast-close-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        min-width: 36px;
        min-height: 36px;
        border: none;
        background: rgba(255, 255, 255, 0.12);
        color: inherit;
        border-radius: 50%;
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
        transition: background 150ms ease, transform 150ms ease;
      }

      .broadcast-close-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .broadcast-close-btn:active {
        transform: scale(0.92);
      }
    </style>

    <script>
      (function() {
        // 1. Force PWA background update for installed apps without needing reinstallation
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].update().catch(function() {});
            }
          });
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!window.__sw_reloaded) {
              window.__sw_reloaded = true;
              window.location.reload();
            }
          });
        }

        // 2. Production-Ready Dynamic Broadcast Banner Engine (WebView / Hybrid Shell)
        var STORAGE_KEY = 'dismissed_broadcast_id';

        function hideBanner() {
          var wrapper = document.getElementById('broadcast-banner-wrapper');
          if (wrapper) wrapper.classList.remove('is-visible');
        }

        function displayBanner(config) {
          if (!config || !config.active || !config.text) return;

          // Check if this specific banner ID has been dismissed by the user
          try {
            var dismissedId = localStorage.getItem(STORAGE_KEY);
            if (dismissedId && dismissedId === config.id) {
              return; // Stays hidden until a new banner ID is issued
            }
          } catch (e) {
            // Gracefully handle private browsing or storage errors
          }

          var wrapper = document.getElementById('broadcast-banner-wrapper');
          var banner = document.getElementById('broadcast-banner');
          var textEl = document.getElementById('broadcast-text');
          var linkEl = document.getElementById('broadcast-link');
          var closeBtn = document.getElementById('broadcast-close-btn');

          if (!wrapper || !banner || !textEl || !closeBtn) return;

          // Apply dynamic colors
          if (config.bg_color) banner.style.backgroundColor = config.bg_color;
          if (config.text_color) banner.style.color = config.text_color;

          // Set banner text
          textEl.textContent = config.text;

          // Set optional action link
          if (config.link_url && config.link_url.trim() !== '') {
            linkEl.href = config.link_url;
            linkEl.hidden = false;
          } else {
            linkEl.hidden = true;
          }

          // Unhide markup and trigger smooth grid slide-down
          banner.hidden = false;
          requestAnimationFrame(function() {
            wrapper.classList.add('is-visible');
          });

          // Dismiss handler with localStorage tracking
          closeBtn.onclick = function() {
            hideBanner();
            try {
              if (config.id) {
                localStorage.setItem(STORAGE_KEY, config.id);
              }
            } catch (e) {}
          };
        }

        // Fetch centralized banner.json with cache-busting timestamp
        var bannerUrl = '/banner.json?_t=' + Date.now();
        fetch(bannerUrl)
          .then(function(res) {
            if (!res.ok) throw new Error('Banner fetch failed with status: ' + res.status);
            return res.json();
          })
          .then(function(data) {
            displayBanner(data);
          })
          .catch(function(err) {
            // Edge Case: Gracefully fail silently on network issues, and check multi-tier fallback
            fetchFallback();
          });

        function fetchFallback() {
          var restUrl = 'https://firestore.googleapis.com/v1/projects/grounded-clover-gf4nj/databases/ai-studio-tafseerenamonaqu-e45100a9-eb66-416f-9e57-d1e580b5b9a6/documents/app_stats/announcement?key=AIzaSyDwKtJybm0cRwdPl9fMW5BV6JvlWRSaZ4k&_t=' + Date.now();
          fetch(restUrl)
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(d) {
              if (d && d.fields && d.fields.active && d.fields.active.booleanValue && d.fields.message) {
                displayBanner({
                  id: (d.fields.updatedAt && d.fields.updatedAt.timestampValue) || 'announcement-fallback',
                  active: true,
                  text: d.fields.message.stringValue,
                  bg_color: '#064e3b',
                  text_color: '#ffffff',
                  link_url: d.fields.link && d.fields.link.stringValue ? d.fields.link.stringValue : ''
                });
              }
            })
            .catch(function() {});
        }
      })();
    </script>
