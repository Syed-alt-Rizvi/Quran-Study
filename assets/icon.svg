<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Islamic Green Gradient Canvas -->
    <radialGradient id="greenCanvas" cx="50%" cy="46%" r="68%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    
    <!-- Stylized Drop Shadow for Legibility and Depth -->
    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022c22" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022c22" flood-opacity="0.3" />
    </filter>

    <linearGradient id="goldWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
  </defs>

  <!-- Green Canvas Base -->
  <rect width="1024" height="1024" fill="url(#greenCanvas)" />

  <!-- Subtle Elegant Geometric Border Accent (Inside Adaptive Icon Safe Zone) -->
  <rect x="96" y="96" width="832" height="832" rx="48" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.22" />
  <rect x="112" y="112" width="800" height="800" rx="36" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.14" />

  <!-- Stylized Words: Shia Markaz in Vector Typography -->
  <g filter="url(#vectorGlow)" text-anchor="middle">
    <!-- SHIA -->
    <text 
      x="512" 
      y="435" 
      fill="url(#goldWhite)" 
      font-family="'Cinzel Decorative', 'Cinzel', 'Playfair Display', 'Trajan Pro', 'Liberation Serif', 'FreeSerif', 'Georgia', serif" 
      font-size="155" 
      font-weight="800" 
      letter-spacing="14">SHIA</text>

    <!-- Stylized Vector Ornamental Divider -->
    <path 
      d="M 340 488 C 400 484, 460 492, 492 488 L 512 474 L 532 488 C 564 492, 624 484, 684 488" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="3" 
      stroke-linecap="round" 
      stroke-opacity="0.85" />
    
    <!-- Central Calligraphic Diamond Accent -->
    <polygon points="512,476 520,488 512,500 504,488" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- MARKAZ -->
    <text 
      x="512" 
      y="620" 
      fill="url(#goldWhite)" 
      font-family="'Cinzel Decorative', 'Cinzel', 'Playfair Display', 'Trajan Pro', 'Liberation Serif', 'FreeSerif', 'Georgia', serif" 
      font-size="125" 
      font-weight="700" 
      letter-spacing="18">MARKAZ</text>
  </g>
</svg>
