<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Islamic Emerald Radial Gradient -->
    <radialGradient id="emeraldCanvas" cx="50%" cy="46%" r="68%" fx="50%" fy="40%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="85%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <!-- Persian Gold Luster Gradient -->
    <linearGradient id="persianGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Luminous Ivory Gold for Typography -->
    <linearGradient id="ivoryLuster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Stylized Drop Shadow Filter -->
    <filter id="medallionGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#011b15" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Emerald Canvas -->
  <rect width="1024" height="1024" fill="url(#emeraldCanvas)" />

  <!-- Outer Persian Border Frame -->
  <rect x="72" y="72" width="880" height="880" rx="48" fill="none" stroke="url(#persianGold)" stroke-width="3" stroke-opacity="0.4" />
  <rect x="92" y="92" width="840" height="840" rx="38" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.2" />

  <!-- Corner Arabesque Florets -->
  <g fill="url(#persianGold)" fill-opacity="0.5">
    <circle cx="92" cy="92" r="6" />
    <circle cx="932" cy="92" r="6" />
    <circle cx="92" cy="932" r="6" />
    <circle cx="932" cy="932" r="6" />
  </g>

  <!-- Central Persian Shamseh (شمسہ) Medallion - Positioned inside Android safe circle -->
  <g filter="url(#medallionGlow)" transform="translate(512, 435)">
    <!-- 16-Point Radiant Interlocking Star -->
    <polygon points="
      0,-225 66,-160 160,-160 160,-66 225,0 160,66 160,160 66,160 
      0,225 -66,160 -160,160 -160,66 -225,0 -160,-66 -160,-160 -66,-160"
      fill="#047857" stroke="url(#persianGold)" stroke-width="4.5" />

    <polygon points="
      0,-210 61,-150 150,-150 150,-61 210,0 150,61 150,150 61,150 
      0,210 -61,150 -150,150 -150,61 -210,0 -150,-61 -150,-150 -61,-150"
      transform="rotate(22.5)"
      fill="#064e3b" stroke="url(#persianGold)" stroke-width="2.5" stroke-opacity="0.85" />

    <!-- Inner Sacred Circle -->
    <circle cx="0" cy="0" r="165" fill="#022c22" stroke="url(#persianGold)" stroke-width="3.5" />
    <circle cx="0" cy="0" r="152" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.35" />

    <!-- Authentic Arabic Calligraphy: شِيعَة (Top) and مَرْكَز (Bottom) -->
    <text x="0" y="-12" 
      fill="url(#ivoryLuster)" 
      font-family="'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', 'Amiri Quran', serif" 
      font-size="86" 
      font-weight="bold" 
      text-anchor="middle"
      letter-spacing="1">شِيعَة</text>

    <!-- Arabesque Center Rosette Divider -->
    <g transform="translate(0, 16)">
      <path d="M -75 0 C -50 -7, -20 7, 0 0 C 20 7, 50 -7, 75 0" fill="none" stroke="url(#persianGold)" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="0,-6 6,0 0,6 -6,0" fill="url(#persianGold)" />
      <circle cx="-30" cy="0" r="2.5" fill="url(#persianGold)" />
      <circle cx="30" cy="0" r="2.5" fill="url(#persianGold)" />
    </g>

    <text x="0" y="86" 
      fill="url(#ivoryLuster)" 
      font-family="'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', 'Amiri Quran', serif" 
      font-size="74" 
      font-weight="bold" 
      text-anchor="middle"
      letter-spacing="2">مَرْكَز</text>
  </g>

  <!-- Typography Below Medallion: SHIA MARKAZ (Compact to prevent circular cropping on Android) -->
  <g text-anchor="middle" filter="url(#medallionGlow)">
    <text 
      x="512" 
      y="716" 
      fill="url(#ivoryLuster)" 
      font-family="'Cinzel Decorative', 'Cinzel', 'Playfair Display', 'Trajan Pro', 'Georgia', serif" 
      font-size="46" 
      font-weight="800" 
      letter-spacing="6">SHIA MARKAZ</text>

    <!-- Persian Ornamental Underline Flourish -->
    <path 
      d="M 372 738 C 442 732, 582 732, 652 738" 
      fill="none" 
      stroke="url(#persianGold)" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-opacity="0.9" />
    <polygon points="512,734 517,738 512,742 507,738" fill="url(#persianGold)" />
  </g>
</svg>
