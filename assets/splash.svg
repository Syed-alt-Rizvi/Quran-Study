<svg width="2732" height="2732" viewBox="0 0 2732 2732" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Emerald & Persian Green Radial Gradient -->
    <radialGradient id="splashBg" cx="50%" cy="50%" r="70%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="80%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <!-- Golden Gradients for Persian Ornamental Details -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="ivoryWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#022c22" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>

    <filter id="medallionShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#011b15" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="2732" height="2732" fill="url(#splashBg)" />

  <!-- Background Persian Geometric Star Lattice (Subtle Opacity) -->
  <g stroke="#34d399" stroke-width="1.5" stroke-opacity="0.08" fill="none">
    <circle cx="1366" cy="1366" r="1100" />
    <circle cx="1366" cy="1366" r="950" />
    <circle cx="1366" cy="1366" r="800" />
    <circle cx="1366" cy="1366" r="650" />
    <!-- 12-Fold Radial Star Lines -->
    <line x1="1366" y1="266" x2="1366" y2="2466" />
    <line x1="266" y1="1366" x2="2466" y2="1366" />
    <line x1="588" y1="588" x2="2144" y2="2144" />
    <line x1="2144" y1="588" x2="588" y2="2144" />
    <line x1="816" y1="413" x2="1916" y2="2319" />
    <line x1="1916" y1="413" x2="816" y2="2319" />
    <line x1="413" y1="816" x2="2319" y2="1916" />
    <line x1="2319" y1="816" x2="413" y2="1916" />
  </g>

  <!-- Persian Ornamental Border Frame -->
  <rect x="180" y="180" width="2372" height="2372" rx="40" fill="none" stroke="url(#goldSheen)" stroke-width="3" stroke-opacity="0.35" />
  <rect x="210" y="210" width="2312" height="2312" rx="30" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2" />

  <!-- Corner Arabesque Florets -->
  <g fill="url(#goldSheen)" fill-opacity="0.4">
    <circle cx="210" cy="210" r="12" />
    <circle cx="2522" cy="210" r="12" />
    <circle cx="210" cy="2522" r="12" />
    <circle cx="2522" cy="2522" r="12" />
  </g>

  <!-- Central Persian Shamseh (شمسہ) Medallion -->
  <g filter="url(#medallionShadow)" transform="translate(1366, 1260)">
    <!-- Outer Octagonal Star Medallion Base -->
    <polygon points="
      0,-440 128,-312 312,-312 312,-128 440,0 312,128 312,312 128,312 
      0,440 -128,312 -312,312 -312,128 -440,0 -312,-128 -312,-312 -128,-312"
      fill="#047857" stroke="url(#goldSheen)" stroke-width="6" />

    <!-- Rotated 45-degree Interlocking Octagonal Star -->
    <polygon points="
      0,-410 120,-290 290,-290 290,-120 410,0 290,120 290,290 120,290 
      0,410 -120,290 -290,290 -290,120 -410,0 -290,-120 -290,-290 -120,-290"
      transform="rotate(22.5)"
      fill="#064e3b" stroke="url(#goldSheen)" stroke-width="3.5" stroke-opacity="0.8" />

    <!-- Inner Circle with Emerald Radial Sheen -->
    <circle cx="0" cy="0" r="320" fill="#022c22" stroke="url(#goldSheen)" stroke-width="5" />
    <circle cx="0" cy="0" r="300" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.4" />

    <!-- Persian Decorative Crest (Crown/Taj Motif) -->
    <path d="M -80 -230 C -40 -265, 40 -265, 80 -230 L 0 -280 Z" fill="url(#goldSheen)" />

    <!-- Sacred Bismillah Calligraphic Ribbon -->
    <text x="0" y="-180" 
      fill="url(#goldSheen)" 
      font-family="'Amiri Quran', 'Amiri', 'Noto Naskh Arabic', serif" 
      font-size="44" 
      font-weight="bold" 
      text-anchor="middle"
      letter-spacing="2">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>

    <!-- Center Calligraphy: "شيعة مركز" -->
    <!-- Large Artistic Central Arabic Calligraphy -->
    <g filter="url(#goldGlow)" text-anchor="middle">
      <text x="0" y="-10" 
        fill="url(#ivoryWhite)" 
        font-family="'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', serif" 
        font-size="160" 
        font-weight="bold" 
        letter-spacing="2">شِيعَة</text>

      <!-- Calligraphic Center Rosette Divider -->
      <g transform="translate(0, 40)">
        <path d="M -160 0 C -100 -14, -40 14, 0 0 C 40 14, 100 -14, 160 0" fill="none" stroke="url(#goldSheen)" stroke-width="4" stroke-linecap="round" />
        <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#goldSheen)" />
        <circle cx="-60" cy="0" r="4" fill="url(#goldSheen)" />
        <circle cx="60" cy="0" r="4" fill="url(#goldSheen)" />
      </g>

      <text x="0" y="165" 
        fill="url(#ivoryWhite)" 
        font-family="'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', serif" 
        font-size="140" 
        font-weight="bold" 
        letter-spacing="4">مَرْكَز</text>
    </g>

    <!-- Bottom Medallion Finial Accent -->
    <path d="M -80 230 C -40 265, 40 265, 80 230 L 0 280 Z" fill="url(#goldSheen)" />
  </g>

  <!-- Typography Below Medallion: SHIA MARKAZ -->
  <g text-anchor="middle" filter="url(#goldGlow)">
    <text x="1366" y="1850" 
      fill="url(#ivoryWhite)" 
      font-family="'Cinzel Decorative', 'Cinzel', 'Playfair Display', 'Georgia', serif" 
      font-size="92" 
      font-weight="800" 
      letter-spacing="22">SHIA MARKAZ</text>

    <!-- Subtle Persian Ornamental Underline Flourish -->
    <path d="M 1066 1890 C 1216 1880, 1516 1880, 1666 1890" 
      fill="none" 
      stroke="url(#goldSheen)" 
      stroke-width="3" 
      stroke-linecap="round" 
      stroke-opacity="0.9" />
    <polygon points="1366,1882 1374,1890 1366,1898 1358,1890" fill="url(#goldSheen)" />

    <!-- Subtitle: Holy Quran • Shia Tafseer • Mafatih Al Jinan -->
    <text x="1366" y="1960" 
      fill="#A7F3D0" 
      font-family="'Inter', sans-serif" 
      font-size="34" 
      font-weight="500" 
      letter-spacing="6">HOLY QURAN • SHIA TAFSEER • MAFATIH AL JINAN</text>

    <!-- Ahlulbayt (a.s) Sanctified Dedication -->
    <text x="1366" y="2020" 
      fill="#6EE7B7" 
      font-family="'Amiri', 'Noto Naskh Arabic', serif" 
      font-size="36" 
      font-weight="normal" 
      opacity="0.85">اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَآلِ مُحَمَّدٍ</text>
  </g>
</svg>
