    <script>
      (function() {
        function adjustLayoutToResolution() {
          try {
            var isFramed = window.self !== window.top;
            var ua = navigator.userAgent || '';
            var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);

            // True viewport detection
            var clientW = document.documentElement.clientWidth || window.innerWidth || 980;
            var clientH = document.documentElement.clientHeight || window.innerHeight || 600;
            
            // Set dynamic viewport units so mobile browser bars never clip UI
            document.documentElement.style.setProperty('--app-vw', clientW + 'px');
            document.documentElement.style.setProperty('--app-vh', clientH + 'px');

            if (isFramed && (isMobileUA || isTouch)) {
              // Physical screen dimensions
              var sW = window.screen ? window.screen.width : 390;
              var sH = window.screen ? window.screen.height : 844;
              var isLandscape = clientW > clientH;
              var targetWidth = isLandscape ? Math.max(sW, sH) : Math.min(sW, sH);
              
              if (targetWidth > 0 && clientW > targetWidth * 1.25) {
                var zoomRatio = +(clientW / targetWidth).toFixed(2);
                if (zoomRatio >= 1.25 && zoomRatio <= 4.0) {
                  document.documentElement.style.zoom = zoomRatio;
                  document.documentElement.classList.add('framed-mobile-zoom');
                  return;
                }
              }
            }
            
            document.documentElement.style.zoom = '';
            document.documentElement.classList.remove('framed-mobile-zoom');
          } catch(e) {}
        }

        adjustLayoutToResolution();
        window.addEventListener('resize', adjustLayoutToResolution);
        window.addEventListener('orientationchange', adjustLayoutToResolution);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', adjustLayoutToResolution);
        }
        document.addEventListener('DOMContentLoaded', adjustLayoutToResolution);
      })();
    </script>
