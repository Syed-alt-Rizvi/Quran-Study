    <script>
      (function() {
        function matchFramedResolution() {
          if (typeof window === 'undefined') return;
          try {
            var isFramed = window.self !== window.top;
            if (!isFramed) {
              document.documentElement.style.zoom = '';
              return;
            }
            var isTouchOrMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || 
              ('ontouchstart' in window && Math.max(window.screen.width, window.screen.height) < 1366);

            if (isTouchOrMobile) {
              var isLandscape = Math.abs(window.orientation) === 90 || Math.abs(window.orientation) === 270;
              var screenDim = isLandscape 
                ? Math.max(window.screen.width, window.screen.height) 
                : Math.min(window.screen.width, window.screen.height);
              var frameWidth = window.innerWidth || document.documentElement.clientWidth;

              if (screenDim > 0 && frameWidth > screenDim * 1.15) {
                var scale = frameWidth / screenDim;
                document.documentElement.style.zoom = scale;
              } else {
                document.documentElement.style.zoom = '';
              }
            } else {
              document.documentElement.style.zoom = '';
            }
          } catch (e) {}
        }
        matchFramedResolution();
        window.addEventListener('resize', matchFramedResolution, { passive: true });
        window.addEventListener('orientationchange', matchFramedResolution, { passive: true });
      })();
    </script>
